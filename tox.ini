[tox]
envlist = e2e, integration
skipsdist = true
requires = tox>=4

[testenv:e2e]
basepython = python3
commands =
    python -c "import shutil; shutil.rmtree('tests/e2e', ignore_errors=True)" 
    python tests/tests_e2e.py
passenv = PIPEX_DEBUG, PIPEX_LOG_LEVEL
# To debug: PIPEX_DEBUG=1 tox -e e2e

[testenv:clean_e2e]
basepython = python3
commands =
    python -c "import shutil; shutil.rmtree('tests/e2e', ignore_errors=True)"

[testenv:integration]
basepython = python3
commands =
    python tests/tests_integration.py
passenv = PIPEX_DEBUG, PIPEX_LOG_LEVEL, PIPEX_FAIL_PIPE_AT, PIPEX_FAIL_FORK, PIPEX_FAIL_DUP2_AT, PIPEX_FAIL_OPEN_PATH, PIPEX_FAIL_EXECVE
